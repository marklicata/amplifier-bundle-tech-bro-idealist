# =============================================================================
# product-1-pager
# =============================================================================
#
# Generate a senior-leader-ready product 1-pager for an engineering research
# project by pointing Amplifier at a repository.
#
# Designed for engineers with low product sense: point it at a repo, get a
# document you can put in front of a senior leader without embarrassment.
#
# Required agents:
#   - foundation:explorer  (repo exploration)
#   - self                 (writing, via model_role: writing)
#
# Context variables:
#   repo_path      (REQUIRED) Path to the repository to analyze.
#   output_format  (optional) "markdown" (default) or "json".
#   researcher     (optional) Name of the researcher / project owner.
#                             Blank renders as "Unknown".
#   git_url        (optional) Repository remote URL. Blank triggers best-effort
#                             detection from the repo, falling back to repo_path.
#
# Usage:
#   amplifier run "execute recipes/product-1-pager.yaml with repo_path=/path/to/repo"
#
#   amplifier run "execute recipes/product-1-pager.yaml with \
#     repo_path=/path/to/repo, output_format=json, researcher=Jane Doe, \
#     git_url=https://github.com/org/repo"
#
# Output (written to the CURRENT WORKING DIRECTORY):
#   ./product-1-pager.md     when output_format is "markdown" (default)
#   ./product-1-pager.json   when output_format is "json"
#
# =============================================================================
# CHANGELOG
# =============================================================================
#
# v1.1.0 (2026-08-05):
#   - NEW FEATURE: Dual output format via the `output_format` context variable
#     * "markdown" (default) writes product-1-pager.md — behavior unchanged
#     * "json" writes product-1-pager.json against a fully specified schema
#       that mirrors the markdown template field-for-field
#     * DESIGN DECISION: [AI Recommendation — needs your review] markers are
#       embedded INLINE in the JSON string values rather than expressed as
#       sibling boolean flags. Rationale: keeps every list a plain string[],
#       avoids wrapping array elements in objects, and lets `needs` and `wants`
#       carry independent confidence (a single field-level boolean cannot).
#       Result: the JSON and markdown variants are content-identical, so one
#       can be rendered from the other without information loss.
#     * Both variants share one writing step. The stage-classification and
#       7-questions framework is defined ONCE; only the serialization branches.
#       Splitting into two steps would have duplicated the framework and
#       guaranteed drift between the two output paths.
#     * Unrecognized `output_format` values fall back to markdown rather than
#       producing undefined behavior.
#   - NEW FEATURE: `researcher` and `git_url` metadata fields
#     * Both optional, defaulting to "". Rendered as header metadata directly
#       beneath Stage in markdown; top-level strings in JSON.
#     * EXPLICITLY EXEMPT from the 600-word limit. Stated in the prompt so the
#       model does not sacrifice content bullets to pay for header lines.
#     * git_url resolution order: explicit value -> remote detected during
#       exploration -> repo_path as final fallback. Never left blank.
#     * researcher resolves: explicit input -> top commit author (labeled as
#       [AI Recommendation]) -> "Unknown". The explorer now gathers commit
#       authorship statistics (item 7) to feed this resolution chain.
#   - IMPROVEMENT: explore-repo now reports the git remote URL (evidence item 7)
#     * ROOT CAUSE for adding it: the writing step can only resolve git_url from
#       evidence it was handed. Asking it to "detect" a remote that exploration
#       never surfaced would force exactly the speculation the rest of this
#       recipe is built to prevent.
#
# v1.0.0 (2026-07-31):
#   - NEW FEATURE: Initial release
#     * Two-step flat recipe: explore repo, then write 1-pager
#     * Embeds stage classification (Research Idea / Prototype / Product)
#     * Embeds the 7 product questions with "Unknown" as a valid answer
#     * Enforces strict 600-word bulleted output format
#
# =============================================================================

name: "product-1-pager"
description: "Analyze a repository and generate a concise, senior-leader-ready product 1-pager covering stage, problem, users, evidence, ownership, and success criteria. Outputs markdown or JSON."
version: "1.1.0"
tags: ["product", "1-pager", "research", "repo-analysis", "product-sense"]

context:
  # Required: path to the repository to analyze
  repo_path: ""

  # Optional: "markdown" (default) or "json"
  output_format: "markdown"

  # Optional: researcher / project owner name. Blank renders as "Unknown".
  researcher: ""

  # Optional: repository remote URL. Blank triggers best-effort detection,
  # falling back to repo_path.
  git_url: ""

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Gather raw evidence from the repo.
  # Deliberately evidence-focused, not interpretive — the framework is applied
  # in step 2. This step's job is to find facts, including absent facts.
  # ---------------------------------------------------------------------------
  - id: "explore-repo"
    agent: "foundation:explorer"
    prompt: |
      Explore the repository at: {{repo_path}}

      Your job is to gather EVIDENCE for a product assessment. You are not
      writing the assessment — you are collecting the raw material for it.

      Read the README, docs, code comments, config files, tests, CI configs,
      issue templates, CHANGELOG, and recent commit messages.

      Extract and report the following:

      1. WHAT THE PROJECT DOES FOR USERS
         - Describe it in plain language a non-engineer would understand.
         - Strip out jargon, acronyms, and internal codenames. If the repo only
           describes itself in jargon, translate it and say so.

      2. MATURITY INDICATORS
         Look for concrete signals and report what you find AND what is absent:
         - Tests (present? meaningful coverage? or token/smoke only?)
         - CI/CD configs (.github/workflows, azure-pipelines, etc.)
         - Deployment artifacts (Dockerfile, k8s manifests, helm charts,
           terraform, serverless configs)
         - Any mention of users, customers, pilots, or production traffic
         - Issue tracker character: real-world bug reports vs. open research
           questions vs. empty
         - Any hosted demo, API endpoint, published package, or live URL
         - Versioning/release discipline (tags, releases, changelog)

      3. THE PROBLEM IT SOLVES FOR USERS
         - What breaks or is painful without this? Who feels that pain?
         - Source this from README, docs, comments, and commit messages.
         - Quote or cite where you found it.

      4. USERS, CUSTOMERS, OR PARTNER TEAMS
         - Any named people, roles, teams, orgs, or customer segments mentioned
           anywhere in the repo.

      5. EVIDENCE OF VALIDATION
         - Metrics, benchmarks, eval results, user feedback, published papers,
           partner conversations, leadership interest, funding, or awards.

      6. CONNECTED PRODUCT TEAMS OR ORGANIZATIONAL PARTNERS
         - Any signal about which product team or org would consume this work.

      7. COMMIT AUTHORSHIP
         - Run `git log --format="%an" | sort | uniq -c | sort -rn | head -10`
           (or read the git log directly) to produce a ranked list of commit
           authors by commit count.
         - Report: author name, commit count, and percentage of total commits
           for the top contributors (up to 5).
         - Also note any author listed as owner in CODEOWNERS, MAINTAINERS,
           or similar files if present.
         - If git history is unavailable or the repo has no commits, report
           "NOT FOUND".

      8. REPOSITORY REMOTE URL
         - Make a best-effort attempt to determine the repository's canonical
           remote URL. Check, in order:
           a. `.git/config` (the [remote "origin"] url entry)
           b. README badges, clone instructions, or install commands that embed
              a repository URL
           c. package metadata (package.json "repository", pyproject.toml
              [project.urls], setup.py url=, Cargo.toml repository=)
         - Report the URL exactly as found, and say WHERE you found it.
         - If no remote URL can be found anywhere, report "NOT FOUND".
         - Do NOT construct a plausible-looking URL from the directory name.

      CRITICAL: Absence of evidence IS evidence. If you cannot find something,
      say "NOT FOUND" explicitly rather than inferring or inventing it. Do not
      speculate about users, customers, or validation that the repo does not
      actually mention. A confident "not found" is more useful than a guess.

      Report your findings as organized notes under the eight headings above.
    output: "repo_findings"
    timeout: 1200

  # ---------------------------------------------------------------------------
  # Step 2: Apply the product framework and write the deliverable.
  # Uses model_role: writing for quality long-form prose judgment.
  #
  # The framework (stage classification + 7 questions + writing rules) is
  # defined ONCE here and is identical for both output formats. Only the
  # serialization step at the end branches on {{output_format}}.
  # ---------------------------------------------------------------------------
  - id: "write-1-pager"
    agent: "self"
    model_role: "writing"
    prompt: |
      You are writing a product 1-pager for an engineering research project.
      The audience is a senior leader who has 90 seconds and no context.

      Repository analyzed: {{repo_path}}

      INPUTS:
      - Output format requested: "{{output_format}}"
      - Researcher (may be blank): "{{researcher}}"
      - Git URL (may be blank): "{{git_url}}"

      REPO FINDINGS FROM EXPLORATION:
      {{repo_findings}}

      ---

      Apply the following framework to those findings.

      ## STAGE CLASSIFICATION

      Pick EXACTLY ONE stage, based on the evidence — not on ambition:

      - **Research Idea**: Early exploration. No users, no deployment.
        Value delivered = insights that improve a product.
      - **Prototype**: Working demo. Some users. Not production-ready.
        Value delivered = insights + code that improve a product.
      - **Product**: Deployed, real users, actively maintained.
        Value delivered = an entire capability we ship ourselves. (Rare —
        do not classify as Product unless there is real deployment AND real users.)

      Be honest. Most research repos are Research Idea or Prototype.
      Over-classifying destroys the credibility of the whole document.

      ## METADATA FIELDS

      These are HEADER METADATA, not content. Two rules govern them:

      RULE 1 — They do NOT count against the 600-word limit.
      The word budget applies to the assessment content only. Never shorten,
      drop, or compress a content bullet in order to "make room" for these
      fields. They are free.

      RULE 2 — Resolve them as follows:

      **Researcher**
      Resolve in this strict order and stop at the first hit:
      1. If the `researcher` input above is non-empty, use it verbatim.
      2. Otherwise, use the top commit author reported under "COMMIT AUTHORSHIP"
         (evidence item 7) in the findings — the person with the highest commit
         count. Label it: "[AI Recommendation — needs your review]: [name]
         (top committer, N commits)".
      3. If commit authorship is "NOT FOUND", write exactly: `Unknown`

      **Repository / git_url**
      Resolve in this strict order and stop at the first hit:
      1. If the `git_url` input above is non-empty, use it verbatim.
      2. Otherwise, use the remote URL reported under "REPOSITORY REMOTE URL"
         (evidence item 8) in the findings, if it is present and is not
         "NOT FOUND".
      3. Otherwise, fall back to the `repo_path` value: {{repo_path}}

      This field is NEVER blank and NEVER "Unknown" — step 3 always produces a
      value. Do not invent a URL that appears nowhere in the findings; if you
      reach step 3, the local path IS the correct answer.

      ## THE 7 QUESTIONS

      Two modes — know which applies to each question:

      Questions 1, 2, 3, and 7: if the answer is not clear from the repo
      findings, write your best framing hypothesis based on the project's
      domain and likely use case. These developers will not have clear answers
      to a lot of these questions — help them think it through. But label every
      hypothesis with [AI Recommendation — needs your review] so they know it
      is a starting point, not a fact.

      Questions 4 and 5: if the answer is not in the findings, write the
      specific "Unknown" label below and stop. Do not invent evidence. Do not
      guess at a partner team. A blank is honest; a fabricated signal is harmful.

      1. What is the problem? — What breaks without this? Who suffers?
         If unclear: "[AI Recommendation — needs your review]:" + hypothesis.

      2. Who are the users? — A specific role, team, or segment. Never "everyone".
         If unclear: "[AI Recommendation — needs your review]:" + hypothesis.

      3. What are their needs/wants? — Needs = must-haves. Wants = nice-to-haves.
         If unclear: "[AI Recommendation — needs your review]:" + hypothesis.

      4. What evidence do we have that it matters? — Data, feedback, a partner
         ask, or a leadership signal.
         If none found: "Unknown — needs real data signal." Do not invent.

      5. Which team owns this space? — The product team or org that should
         consume this output.
         If unknown: "Unknown — needs a partner team." Do not guess.

      6. Have we talked to them? — Yes / No / Partial, plus what was learned
         (1 bullet if yes).

      7. What would success look like? — A concrete outcome. Not "we ship a
         feature" — an actual change in the world.
         If unclear: "[AI Recommendation — needs your review]:" + hypothesis.

      ## OUTPUT FORMAT

      Maximum 600 words total. Bullets and phrases only — NO prose paragraphs.
      Use as many bullets as the content needs. Some answers are one bullet;
      others need 2-3. Do not compress a richer answer into one bullet because
      the template shows one. Structure serves content, not the other way around.

      The 600-word limit covers the assessment content. It does NOT cover the
      Researcher and Repository metadata fields, section headings, or JSON
      structural syntax (keys, braces, brackets).

      ### FORMAT SELECTION

      Look at the "Output format requested" value above.
      - If it is exactly "json" (case-insensitive), produce FORMAT B.
      - For ANY other value — including "markdown", an empty string, a typo, or
        an unrecognized word — produce FORMAT A.

      Produce EXACTLY ONE of the two formats. Never both.

      ---

      ### FORMAT A — MARKDOWN (default)

      ```
      ## [Project Name] — Product 1-Pager

      **Stage**: [Research Idea | Prototype | Product]
      **Researcher**: [researcher name or "Unknown"]
      **Repository**: [resolved git URL or repo path]

      ---

      **The Problem**
      - [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]

      **The Users**
      - [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]

      **Needs / Wants**
      - Needs: [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]
      - Wants: [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]

      **Evidence It Matters**
      - [1+ bullets — or "Unknown — needs real data signal"]

      **Who Owns This Space**
      - [team/org — or "Unknown — needs a partner team"]

      **Have We Talked to Them?**
      - [Yes / No / Partial + key learnings in 1 bullet]

      **What Success Looks Like**
      - [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]

      ---

      **Impact Path**
      [One sentence: this [stage] delivers [what] to [which product/team]]

      **Open Questions**
      1. [Most pressing unknown to move forward]
      2. [Second]
      3. [Third]
      ```

      ---

      ### FORMAT B — JSON

      Produce a single JSON object matching this schema EXACTLY. The annotations
      below describe each field's type and constraints — replace them with real
      values. The output must be valid JSON with no comments.

      ```
      {
        "project_name": "string — the actual project name from the repo",
        "stage": "string — EXACTLY one of: Research Idea | Prototype | Product",
        "researcher": "string — researcher name, or 'Unknown'",
        "git_url": "string — resolved remote URL, or the repo path fallback",
        "the_problem": ["string", "..."],
        "the_users": ["string", "..."],
        "needs_wants": {
          "needs": ["string", "..."],
          "wants": ["string", "..."]
        },
        "evidence_it_matters": ["string", "..."],
        "who_owns_this_space": ["string", "..."],
        "have_we_talked_to_them": {
          "status": "string — EXACTLY one of: Yes | No | Partial",
          "notes": "string — key learnings in one sentence; empty string if status is No"
        },
        "what_success_looks_like": ["string", "..."],
        "impact_path": "string — one sentence",
        "open_questions": ["string", "string", "string"]
      }
      ```

      JSON RULES — follow all of them:

      - Emit ALL 13 top-level keys. No key may be omitted, even when the answer
        is unknown. No extra keys beyond those listed.
      - Each array element is ONE bullet — the same bullet you would have written
        in the markdown format. Do not merge multiple bullets into one string.
      - Every array must contain at least one element. Never emit `[]`.
      - `open_questions` must contain EXACTLY three elements.
      - **[AI Recommendation] handling**: embed the marker INLINE at the start of
        the string value. Do NOT add boolean flags or wrapper objects.
        Correct:   "[AI Recommendation — needs your review]: Data teams likely
                    lose hours reconciling schema drift by hand."
        Incorrect: {"text": "...", "ai_recommendation": true}
      - **Unknown handling** for questions 4 and 5: emit the unknown label as a
        single-element array, exactly as in markdown.
        "evidence_it_matters": ["Unknown — needs real data signal"]
        "who_owns_this_space": ["Unknown — needs a partner team"]
      - `stage` and `have_we_talked_to_them.status` must match their enumerated
        values character-for-character. No variants, no extra qualifiers.
      - If `have_we_talked_to_them.status` is "No", `notes` is the empty string "".
      - `impact_path` is the same single sentence as the markdown Impact Path.
      - Output raw JSON ONLY: no ``` fences, no preamble, no trailing commentary.
      - Use 2-space indentation. No trailing commas. Escape any embedded
        double quotes and newlines properly.

      ## WRITING RULES

      These apply to BOTH formats identically. The format changes how the
      content is serialized — it never changes the content itself.

      - Replace [Project Name] / "project_name" with the actual project name
        from the repo.
      - Plain language only. No jargon, no acronyms without expansion, no
        marketing voice, no hedging filler.
      - Every factual claim must trace back to the repo findings. If the
        findings do not support it, use "Unknown" or "[AI Recommendation]"
        per the question-level rules above — not silence, not invention.
      - [AI Recommendation — needs your review] answers are explicitly hypotheses
        to help the developer think. Write them as you would frame the question
        in a product review meeting, not as authoritative fact.
      - The Open Questions are the most valuable section for a low-product-sense
        engineer — make them the three questions that would most change the
        project's direction if answered. Not trivia.
      - Stay under 600 words. Cut adjectives before cutting substance.
      - The two documents must be interchangeable: the same repo and findings
        should yield the same assessment whether serialized as markdown or JSON.

      ## FINAL ACTION

      # Output location note: the 1-pager is written to the CURRENT WORKING
      # DIRECTORY (where Amplifier is invoked from), not necessarily inside the
      # target repo. If the user runs this from inside the repo they analyzed,
      # it lands there. If run from elsewhere, it lands in the invocation
      # directory. Print the full path so users can find it.

      Write the completed 1-pager to the current working directory, choosing the
      filename by format:
      - FORMAT A (markdown) -> `product-1-pager.md`
      - FORMAT B (json)     -> `product-1-pager.json`

      Write only ONE file — the one matching the requested format.

      If you wrote JSON, verify it parses as valid JSON before finishing. If it
      does not parse, fix it and rewrite the file.

      Print the full file path after writing. Then reply with the full contents
      of the file so the user can read it without opening it.
    output: "one_pager"
    timeout: 900
