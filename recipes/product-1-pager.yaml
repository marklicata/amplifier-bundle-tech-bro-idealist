# =============================================================================
# product-1-pager
# =============================================================================
#
# Generate a senior-leader-ready product 1-pager for an engineering research
# project by pointing Amplifier at a repository.
#
# Designed for engineers with low product sense: point it at a repo, get a
# document you can put in front of a senior leader without embarrassment.
#
# Required agents:
#   - foundation:explorer  (repo exploration)
#   - self                 (writing, via model_role: writing)
#
# Context variables:
#   repo_path      (REQUIRED unless repo_paths is provided) The repository to
#                             analyze. Three accepted forms:
#                               a. GitHub URL (https://github.com/owner/repo)
#                                  -> browsed remotely via the `gh` CLI and the
#                                     GitHub API. No clone, no disk usage.
#                               b. Any other Git URL (GitLab, Azure DevOps,
#                                  git@, ssh://, *.git)
#                                  -> cloned to a temp directory and explored
#                                     there.
#                               c. Local filesystem path
#                                  -> explored in place.
#   repo_paths     (optional) Comma-separated or newline-separated list of
#                             repos. Each entry follows the same three-form
#                             syntax as repo_path. When non-empty, ALL listed
#                             repos are explored and their findings synthesized
#                             into one unified 1-pager — useful for multi-repo
#                             products. Takes precedence over repo_path.
#   output_format  (optional) "markdown" (default) or "json".
#   researcher     (optional) Name of the researcher / project owner.
#                             Blank renders as "Unknown".
#   git_url        (optional) Repository remote URL, for DISPLAY only. Blank
#                             triggers best-effort detection from the repo,
#                             falling back to repo_path. Never used to fetch.
#
# Usage:
#   # Local path — explored in place
#   amplifier run "execute recipes/product-1-pager.yaml with repo_path=/path/to/repo"
#
#   # GitHub URL — browsed via `gh api`, nothing written to disk
#   amplifier run "execute recipes/product-1-pager.yaml with \
#     repo_path=https://github.com/org/repo"
#
#   # Non-GitHub URL — cloned to a temp dir
#   amplifier run "execute recipes/product-1-pager.yaml with \
#     repo_path=https://gitlab.com/org/repo.git"
#
#   amplifier run "execute recipes/product-1-pager.yaml with \
#     repo_path=/path/to/repo, output_format=json, researcher=Jane Doe, \
#     git_url=https://github.com/org/repo"
#
#   # Multiple repos (comma-separated) — analyzed and synthesized into one 1-pager
#   amplifier run "execute recipes/product-1-pager.yaml with \
#     repo_paths=https://github.com/org/repo-core,https://github.com/org/repo-sdk,/local/path/repo-ui"
#
# Private repositories:
#   GitHub repos (browsed via `gh api`) require an authenticated `gh` CLI —
#   check with `gh auth status`. Other hosts are cloned, which requires
#   credentials already available in the environment (an SSH key or a credential
#   helper). This recipe never prompts for and never stores credentials.
#
# Requirements:
#   `gh` CLI (GitHub URLs only) · `git` (non-GitHub URLs only) · neither is
#   needed for local paths.
#
# Output (written to the CURRENT WORKING DIRECTORY):
#   ./product-1-pager.md     when output_format is "markdown" (default)
#   ./product-1-pager.json   when output_format is "json"
#
# =============================================================================
# CHANGELOG
# =============================================================================
#
# v1.4.0 (2026-08-19):
#   - NEW FEATURE: Multi-repo support via `repo_paths` context variable
#     * `repo_paths` accepts a comma-separated or newline-separated list of repo
#       paths/URLs, each following the same three-form syntax as repo_path
#       (GitHub URL, other Git URL, local filesystem path). When non-empty, it
#       takes precedence over repo_path.
#     * The explore-repo step (STEP -1) now parses the list and analyzes ALL
#       repos independently, organizing evidence under per-repo section headers
#       (`=== REPO N of M: [identifier] ===`) and running the full 8-item
#       evidence checklist for each.
#     * The write-1-pager step synthesizes multi-repo findings into one unified
#       1-pager — treating all listed repos as one system. This is the correct
#       shape for multi-repo products where the product story spans repos.
#   - NEW FEATURE: Stage-calibrated content guard in write-1-pager
#     * ROOT CAUSE: [AI Recommendation] hypothesis generation on Q1–3 and Q7
#       was unconstrained by stage. On Research Idea projects (no users, no
#       deployment), the writing step would reach for PLG frameworks from model
#       training — funnels, cohort retention, CAC/LTV, growth loops — and
#       produce confident-sounding content with no empirical basis under it.
#     * THE FIX: a mandatory stage gate evaluated before any content is written.
#       It restricts hypothesis framing to what the classified stage supports:
#       Research Idea → problem framing and early validation milestones only;
#       Prototype → PLG framing only when actual user data exists in the findings;
#       Product → no additional restrictions.
#     * WHY THIS MATTERS: content calibrated to the wrong stage signals the
#       author doesn't know the difference between research and shipped product.
#       A 1-pager citing retention curves for a two-week prototype destroys
#       its own credibility before the second bullet.
#
# v1.3.0 (2026-08-05):
#   - IMPROVEMENT: GitHub URLs are now browsed remotely via the `gh` CLI and the
#     GitHub API instead of being cloned
#     * ROOT CAUSE: v1.2.0 made hosted repos analyzable by cloning them, which
#       worked but paid a fixed cost on every single run — download the entire
#       repository, write it to disk, then read the four or five files the
#       exploration actually needs. For a large repo that is minutes of transfer
#       and hundreds of megabytes of disk to answer questions that live in the
#       README, the docs directory, and the commit log.
#     * THE KEY INSIGHT: exploration here is READ-ONLY and SPARSE. It never
#       needs a working tree, an index, a checkout, or a branch — it needs the
#       contents of a handful of named files. Cloning is a whole-repository
#       operation being used to serve a handful-of-files question, and GitHub
#       already exposes exactly the handful-of-files primitive: the trees API
#       to see what exists, the contents API to read a specific path. Fetching
#       only what is read makes the cost proportional to the work rather than
#       to the repository.
#     * IMPLEMENTATION: step 0 now classifies {{repo_path}} into three cases
#       rather than two. GitHub URL (matches `https://github.com/owner/repo`,
#       with any `.git` suffix and trailing slash stripped) -> parse owner and
#       repo, browse via `gh api`. Any other URL -> the v1.2.0 clone chain,
#       unchanged. Local path -> explore in place, unchanged since v1.1.0.
#       Backward compatible by construction: the new branch is strictly
#       narrower than the URL branch it was carved out of, so nothing that
#       worked before changes route except GitHub URLs, which get faster.
#     * BROWSE SEQUENCE: `git/trees/HEAD?recursive=1` returns the full file
#       inventory in ONE call, so file selection happens against a known tree
#       rather than by guessing at paths and absorbing 404s. Selected paths are
#       then read individually via the contents API, whose `content` field is
#       base64 and MUST be decoded — a raw read yields plausible-looking
#       gibberish rather than an obvious error, which is the more dangerous
#       failure. `commits?per_page=100` supplies evidence item 7.
#     * WHY `gh api` AND NOT plain `curl`: `gh` reuses the credentials the user
#       has already authenticated, so private repositories work with no new
#       secret handling, and the recipe keeps its promise never to prompt for
#       or store credentials. It also carries the API version headers and rate
#       limit handling for free.
#     * NOT AVAILABLE FOR NON-GITHUB HOSTS: GitLab and Azure DevOps expose
#       comparable APIs, but each needs its own auth story, path scheme, and
#       response shape. Cloning already works there and costs nothing to keep,
#       so the fallback stays rather than tripling the surface area for hosts
#       nobody has asked for yet.
#   - IMPROVEMENT: evidence item 7 (COMMIT AUTHORSHIP) gained an API path
#     * `git log` does not exist without a clone, so the GitHub branch derives
#       the ranked author list from the commits API instead. Same output shape,
#       same downstream researcher-resolution chain, no working tree required.
#     * The API caps at 100 commits per page. When the repo has more, the
#       ranking is reported as based on the 100 most recent commits and SAID SO
#       explicitly, because a silently truncated ranking is the same class of
#       error `--depth 1` was rejected for in v1.2.0.
#   - BUGFIX GUARD: the v1.2.0 "REPOSITORY UNAVAILABLE" halt now also covers
#     GitHub API failures (repo not found, `gh` unauthenticated, `gh` not
#     installed, rate limited)
#     * The guard's reason for existing is unchanged: an empty findings blob
#       handed to the writing step produces a fully hypothesized 1-pager for a
#       repo nobody opened. A new way to fail to read the repo needs the same
#       stop, so the marker string is deliberately identical and the writing
#       step's precondition check needed no change.
#     * `gh api` failing on a GitHub URL does NOT silently fall through to
#       cloning. A 404 usually means the repo does not exist or is not visible
#       to these credentials, and a clone will fail the same way while costing
#       another wait — reporting the actual API error is faster and more useful
#       than laundering it into a second, vaguer failure.
#
# v1.2.0 (2026-08-05):
#   - NEW FEATURE: `repo_path` now accepts a cloneable Git URL, not just a
#     local filesystem path
#     * ROOT CAUSE for adding it: the explorer is a filesystem walker, so a
#       hosted repo could not be analyzed at all. Users reasonably read
#       `git_url` as "the repo to analyze" when it was only ever a display
#       string, producing a 1-pager whose Repository header pointed at a repo
#       that was never actually read. Two fields that both look like a target,
#       only one of which is one, is a trap.
#     * THE KEY INSIGHT: there is exactly ONE analysis target, so it belongs in
#       exactly ONE field. Rejected the alternative of adding a separate
#       `repo_url` input: two target fields require precedence rules for the
#       both-set case, and every downstream reference ({{repo_path}} in the
#       writing step, the git_url fallback chain) would need to branch on which
#       one won. Overloading `repo_path` keeps the target singular and leaves
#       `git_url` with the single unambiguous job it already had: display.
#     * IMPLEMENTATION: the explore-repo prompt gained a preliminary step 0 that
#       tests `{{repo_path}}` for a URL shape (https://, http://, git@, ssh://,
#       or a .git suffix). URL -> clone to a temp dir and treat that as the
#       exploration root. Anything else -> explore in place, byte-identical to
#       v1.1.0 behavior. Backward compatible by construction: local paths never
#       reach the new branch.
#     * Clone uses `--filter=blob:none` so evidence item 7 (COMMIT AUTHORSHIP)
#       still sees FULL commit history. WHY THIS MATTERS: `--depth 1` would have
#       been the reflex choice for speed, but it truncates history to one commit
#       and would silently corrupt the researcher-resolution chain, which reads
#       the top commit author. Blobless clone is fast AND complete.
#     * Falls back to a plain `git clone`, then to `gh repo clone`, so private
#       repos work when the environment is already authenticated. Credentials
#       are never prompted for and never stored.
#   - IMPROVEMENT: evidence item 8 (REPOSITORY REMOTE URL) resolves the clone
#     URL directly when repo_path was a URL, rather than re-deriving it from the
#     temp clone's .git/config. Same answer, one less inference hop.
#   - BUGFIX GUARD: a failed clone now halts with an explicit
#     "REPOSITORY UNAVAILABLE" report, and the writing step refuses to produce a
#     1-pager when it sees that marker.
#     * ROOT CAUSE: without this, a clone failure hands the writing step an empty
#       findings blob. Questions 1, 2, 3, and 7 are permitted to hypothesize when
#       evidence is thin, so the recipe would have cheerfully emitted a fully
#       [AI Recommendation]-labeled 1-pager for a repo it never opened. That is
#       the exact failure mode the "absence of evidence IS evidence" rule exists
#       to prevent, so the guard is a correction, not a new policy.
#
# v1.1.0 (2026-08-05):
#   - NEW FEATURE: Dual output format via the `output_format` context variable
#     * "markdown" (default) writes product-1-pager.md — behavior unchanged
#     * "json" writes product-1-pager.json against a fully specified schema
#       that mirrors the markdown template field-for-field
#     * DESIGN DECISION: [AI Recommendation — needs your review] markers are
#       embedded INLINE in the JSON string values rather than expressed as
#       sibling boolean flags. Rationale: keeps every list a plain string[],
#       avoids wrapping array elements in objects, and lets `needs` and `wants`
#       carry independent confidence (a single field-level boolean cannot).
#       Result: the JSON and markdown variants are content-identical, so one
#       can be rendered from the other without information loss.
#     * Both variants share one writing step. The stage-classification and
#       7-questions framework is defined ONCE; only the serialization branches.
#       Splitting into two steps would have duplicated the framework and
#       guaranteed drift between the two output paths.
#     * Unrecognized `output_format` values fall back to markdown rather than
#       producing undefined behavior.
#   - NEW FEATURE: `researcher` and `git_url` metadata fields
#     * Both optional, defaulting to "". Rendered as header metadata directly
#       beneath Stage in markdown; top-level strings in JSON.
#     * EXPLICITLY EXEMPT from the 600-word limit. Stated in the prompt so the
#       model does not sacrifice content bullets to pay for header lines.
#     * git_url resolution order: explicit value -> remote detected during
#       exploration -> repo_path as final fallback. Never left blank.
#     * researcher resolves: explicit input -> top commit author (labeled as
#       [AI Recommendation]) -> "Unknown". The explorer now gathers commit
#       authorship statistics (item 7) to feed this resolution chain.
#   - IMPROVEMENT: explore-repo now reports the git remote URL (evidence item 7)
#     * ROOT CAUSE for adding it: the writing step can only resolve git_url from
#       evidence it was handed. Asking it to "detect" a remote that exploration
#       never surfaced would force exactly the speculation the rest of this
#       recipe is built to prevent.
#
# v1.0.0 (2026-07-31):
#   - NEW FEATURE: Initial release
#     * Two-step flat recipe: explore repo, then write 1-pager
#     * Embeds stage classification (Research Idea / Prototype / Product)
#     * Embeds the 7 product questions with "Unknown" as a valid answer
#     * Enforces strict 600-word bulleted output format
#
# =============================================================================

name: "product-1-pager"
description: "Analyze one or more repositories (local path, GitHub URL via GitHub API, or any Git URL via clone) and generate a concise, senior-leader-ready product 1-pager. Covers stage, problem, users, evidence, ownership, and success criteria. Supports multi-repo synthesis via repo_paths. Outputs markdown or JSON."
version: "1.4.0"
tags: ["product", "1-pager", "research", "repo-analysis", "product-sense"]

context:
  # Required: the repository to analyze. Three accepted forms:
  #   - GitHub URL (https://github.com/owner/repo) -> browsed via `gh api`,
  #     no clone and no disk usage
  #   - Any other Git URL (git@, ssh://, *.git, GitLab, Azure DevOps)
  #     -> cloned to a temp directory and explored there
  #   - Local filesystem path -> explored in place
  repo_path: ""

  # Optional: "markdown" (default) or "json"
  output_format: "markdown"

  # Optional: researcher / project owner name. Blank renders as "Unknown".
  researcher: ""

  # Optional: analyze multiple repositories and synthesize into one 1-pager.
  # Accepts a comma-separated or newline-separated list of paths/URLs. Each entry
  # follows the same three-form syntax as repo_path (GitHub URL, other Git URL,
  # or local filesystem path). When non-empty, ALL listed repos are explored and
  # their findings synthesized into one unified document — useful for multi-repo
  # products. Takes precedence over repo_path when non-empty.
  repo_paths: ""

  # Optional: DISPLAY-ONLY remote URL for the Repository header. This is never
  # fetched or cloned — to analyze a hosted repo, put its URL in repo_path.
  # Blank triggers best-effort detection, falling back to repo_path.
  git_url: ""

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Gather raw evidence from the repo.
  # Deliberately evidence-focused, not interpretive — the framework is applied
  # in step 2. This step's job is to find facts, including absent facts.
  # ---------------------------------------------------------------------------
  - id: "explore-repo"
    agent: "foundation:explorer"
    prompt: |
      ## STEP -1 — DETERMINE THE REPO LIST (do this before anything else)

      Check both inputs:
        repo_paths: "{{repo_paths}}"
        repo_path:  "{{repo_path}}"

      **If `{{repo_paths}}` is non-empty:**
        - It is your AUTHORITATIVE repo list. Parse it as comma-separated entries.
          Also accept newline-separated. Trim whitespace from each entry.
        - You will analyze EACH entry. Apply STEP 0 classification (Case A / B / C)
          independently to each one.
        - After analyzing all repos, organize your findings with a clear header
          `=== REPO N of M: [identifier] ===` before each repo's evidence section.
        - Run the full EVIDENCE GATHERING checklist (items 1–8) independently for
          each repo.
        - At the very top of your output, state: "Analyzing N repos:" followed by
          a numbered list of each identifier.

      **If `{{repo_paths}}` is empty:**
        - Analyze only the single repo: {{repo_path}}
        - No per-repo section headers are needed — continue as normal.

      ---

      ## STEP 0 — RESOLVE THE ACCESS MODE (apply to each repo)

      The value above is one of THREE things. Classify it, then use the matching
      access mode. Check the cases in this order — the first match wins.

      **CASE A — GITHUB URL.** Matches `https://github.com/<owner>/<repo>`
      (also `http://`, also with a `www.` prefix). Strip any trailing `/`, any
      trailing `.git`, and anything after the owner/repo pair (`/tree/main`,
      `/blob/...`, query strings) before parsing. Extract `owner` and `repo`.
      -> Use MODE A: browse remotely via the GitHub API. Do NOT clone.

      **CASE B — ANY OTHER GIT URL.** Starts with `https://`, `http://`,
      `git@`, or `ssh://`, or ends in `.git`, but is not github.com. GitLab,
      Azure DevOps, Bitbucket, self-hosted, etc.
      -> Use MODE B: clone to a temp directory.

      **CASE C — LOCAL FILESYSTEM PATH.** Anything else.
      -> Use MODE C: explore the path in place.

      State which mode you selected, and for Case A the parsed owner and repo,
      once at the top of your findings.

      Never prompt for credentials, and never write credentials anywhere.

      ---

      ### MODE A — BROWSE GITHUB VIA `gh api` (no clone, no disk usage)

      There is no working tree in this mode. You are fetching individual files
      over the API, so filesystem tools (`glob`, `grep`, directory walks) do not
      apply — use `bash` to run `gh api` commands and read their output.

      **A1. Confirm the tool is usable.** Run `gh auth status`. If `gh` is not
      installed or not authenticated, that is a hard failure — go to the
      FAILURE REPORT below. Do not fall back to cloning (see A5).

      **A2. Fetch the complete file inventory in ONE call:**

          gh api "repos/<owner>/<repo>/git/trees/HEAD?recursive=1"

      This returns every path in the repository. Read it and decide what is
      worth fetching. If the response has `"truncated": true`, the repo is very
      large — say so in your findings, and work from the paths you did receive.

      **A3. Select the files to read.** From the tree, pick the paths that carry
      product signal. Prioritize, and adapt to what actually exists:
        - `README*`, `VISION*`, `ARCHITECTURE*`, `DESIGN*`, `ROADMAP*`
        - `CONTRIBUTING*`, `AGENTS*`, `CLAUDE*`, `CODEOWNERS`, `MAINTAINERS*`
        - `CHANGELOG*`, `docs/**` (read the index/overview docs first)
        - manifests: `package.json`, `pyproject.toml`, `Cargo.toml`,
          `go.mod`, `setup.py`, `*.csproj`
        - maturity signals: `.github/workflows/*`, `Dockerfile`, `docker-compose*`,
          `k8s/**`, `helm/**`, `*.tf`, `azure-pipelines*`, test directories
        - `.github/ISSUE_TEMPLATE/*`

      Fetch the most informative 10–25 files. This is a judgment call: fetch
      enough to answer all eight evidence items, and stop fetching once more
      files stop changing the answers. You do not need the source of every
      module — you need the documents and configs that describe the project.

      **A4. Read a selected file:**

          gh api "repos/<owner>/<repo>/contents/<path>"

      The response's `content` field is BASE64-ENCODED. It MUST be decoded
      before reading — undecoded content looks like plausible text and will
      silently poison your findings. Decode in one step:

          gh api "repos/<owner>/<repo>/contents/<path>" --jq '.content' \
            | tr -d '\n' | base64 -d

      Or fetch the raw bytes directly:

          gh api "repos/<owner>/<repo>/contents/<path>" \
            -H "Accept: application/vnd.github.raw"

      If a file 404s, note it and move on — a missing file is evidence too.

      **A5. If `gh api` fails on the tree call, STOP.** Do not fall back to
      cloning. A 404 or 403 here means the repo does not exist or is not
      visible to the current credentials, and a clone will fail the same way
      after a longer wait. Report the actual API error — it is the more useful
      answer. Go to the FAILURE REPORT below.

      ---

      ### MODE B — CLONE (non-GitHub URLs)

      1. Create a temp directory:
         `WORKDIR=$(mktemp -d)/repo`
      2. Clone with full history but without file blobs — this is fast AND
         keeps every commit, which evidence item 7 depends on:
         `git clone --filter=blob:none "{{repo_path}}" "$WORKDIR"`
      3. If that fails, retry with a plain clone:
         `git clone "{{repo_path}}" "$WORKDIR"`
      4. If that also fails and the repo may be private, try the GitHub CLI,
         which uses existing credentials:
         `gh repo clone "{{repo_path}}" "$WORKDIR"`
      5. The exploration root is now `$WORKDIR`. Report the temp path once at
         the top of your findings so the user can inspect it, then explore it
         exactly as you would a local repo. Leave the clone in place.

      Do NOT use `--depth 1` or any other shallow clone. Shallow clones truncate
      commit history and would silently produce wrong commit-authorship data.

      If ALL clone attempts fail, go to the FAILURE REPORT below.

      ---

      ### MODE C — LOCAL PATH

      The exploration root IS that path. Explore it in place with your normal
      filesystem tools. Nothing to set up.

      ---

      ### FAILURE REPORT (Modes A and B only)

      If the repository could not be reached, stop immediately. Do not explore
      anything, do not substitute a different directory, and do not infer what
      the project might contain from its URL or name. Your ENTIRE response must
      be:

          REPOSITORY UNAVAILABLE — COULD NOT READ REPOSITORY
          Target: {{repo_path}}
          Access mode attempted: [GitHub API | clone]
          Commands attempted: [list them]
          Error output: [paste the actual error]
          Likely cause: [e.g. repo does not exist, private repo and `gh` is not
          authenticated, `gh` not installed, API rate limit exceeded, network
          unreachable, git not installed]

      A clear failure report is the correct and useful output here. A guess
      about the repo's contents is not.

      ## EVIDENCE GATHERING

      Your job is to gather EVIDENCE for a product assessment. You are not
      writing the assessment — you are collecting the raw material for it.

      Everything below operates on the repository you resolved access to in
      step 0, whichever mode you used. The evidence required is identical in
      all three modes — only HOW you read the files differs.

      Read the README, docs, code comments, config files, tests, CI configs,
      issue templates, CHANGELOG, and recent commit messages.

      Extract and report the following:

      1. WHAT THE PROJECT DOES FOR USERS
         - Describe it in plain language a non-engineer would understand.
         - Strip out jargon, acronyms, and internal codenames. If the repo only
           describes itself in jargon, translate it and say so.

      2. MATURITY INDICATORS
         Look for concrete signals and report what you find AND what is absent:
         - Tests (present? meaningful coverage? or token/smoke only?)
         - CI/CD configs (.github/workflows, azure-pipelines, etc.)
         - Deployment artifacts (Dockerfile, k8s manifests, helm charts,
           terraform, serverless configs)
         - Any mention of users, customers, pilots, or production traffic
         - Issue tracker character: real-world bug reports vs. open research
           questions vs. empty
         - Any hosted demo, API endpoint, published package, or live URL
         - Versioning/release discipline (tags, releases, changelog)

      3. THE PROBLEM IT SOLVES FOR USERS
         - What breaks or is painful without this? Who feels that pain?
         - Source this from README, docs, comments, and commit messages.
         - Quote or cite where you found it.

      4. USERS, CUSTOMERS, OR PARTNER TEAMS
         - Any named people, roles, teams, orgs, or customer segments mentioned
           anywhere in the repo.

      5. EVIDENCE OF VALIDATION
         - Metrics, benchmarks, eval results, user feedback, published papers,
           partner conversations, leadership interest, funding, or awards.

      6. CONNECTED PRODUCT TEAMS OR ORGANIZATIONAL PARTNERS
         - Any signal about which product team or org would consume this work.

      7. COMMIT AUTHORSHIP
         Produce a ranked list of commit authors by commit count. How you get
         it depends on the access mode from step 0:

         - **MODE A (GitHub API):** there is no local git history, so use the
           commits endpoint:
             `gh api "repos/<owner>/<repo>/commits?per_page=100" --jq '.[].commit.author.name' | sort | uniq -c | sort -rn | head -10`
           This returns AT MOST the 100 most recent commits. If the repo has
           more than 100 commits, say so explicitly and label the ranking
           "based on the 100 most recent commits". Do NOT present a truncated
           ranking as if it covered full history.
         - **MODES B and C (clone / local path):** read the git log directly:
             `git log --format="%an" | sort | uniq -c | sort -rn | head -10`
           This covers full history.

         - Report: author name, commit count, and percentage of counted commits
           for the top contributors (up to 5). State which basis the counts are
           on (full history vs. 100 most recent).
         - Also note any author listed as owner in CODEOWNERS, MAINTAINERS,
           or similar files if present.
         - If commit history is unavailable or the repo has no commits, report
           "NOT FOUND".

      8. REPOSITORY REMOTE URL
         - If step 0 classified {{repo_path}} as a URL (Case A or Case B), that
           URL IS the canonical remote. Report it verbatim, sourced as
           "repository URL supplied as repo_path". You are done with this item.
         - Otherwise, make a best-effort attempt to determine the repository's
           canonical remote URL. Check, in order:
           a. `.git/config` (the [remote "origin"] url entry)
           b. README badges, clone instructions, or install commands that embed
              a repository URL
           c. package metadata (package.json "repository", pyproject.toml
              [project.urls], setup.py url=, Cargo.toml repository=)
         - Report the URL exactly as found, and say WHERE you found it.
         - If no remote URL can be found anywhere, report "NOT FOUND".
         - Do NOT construct a plausible-looking URL from the directory name.

      CRITICAL: Absence of evidence IS evidence. If you cannot find something,
      say "NOT FOUND" explicitly rather than inferring or inventing it. Do not
      speculate about users, customers, or validation that the repo does not
      actually mention. A confident "not found" is more useful than a guess.

      Report your findings as organized notes under the eight headings above.
    output: "repo_findings"
    timeout: 1200

  # ---------------------------------------------------------------------------
  # Step 2: Apply the product framework and write the deliverable.
  # Uses model_role: writing for quality long-form prose judgment.
  #
  # The framework (stage classification + 7 questions + writing rules) is
  # defined ONCE here and is identical for both output formats. Only the
  # serialization step at the end branches on {{output_format}}.
  # ---------------------------------------------------------------------------
  - id: "write-1-pager"
    agent: "self"
    model_role: "writing"
    prompt: |
      You are writing a product 1-pager for an engineering research project.
      The audience is a senior leader who has 90 seconds and no context.

      INPUTS:
      - Output format requested: "{{output_format}}"
      - Researcher (may be blank): "{{researcher}}"
      - Git URL (may be blank): "{{git_url}}"
      - repo_paths (if set, multiple repos were analyzed): "{{repo_paths}}"
      - repo_path (single repo or fallback): "{{repo_path}}"

      REPO FINDINGS FROM EXPLORATION:
      {{repo_findings}}

      ---

      ## PRECONDITION — CHECK THIS BEFORE ANYTHING ELSE

      If the findings above contain "REPOSITORY UNAVAILABLE", the repository was
      never read. Do NOT write a 1-pager, do NOT write any file, and do NOT fill
      the gaps with [AI Recommendation] hypotheses — a document built entirely on
      inference about a repo nobody opened is worse than no document.

      Instead, report the failure to the user verbatim: the target, what was
      attempted, the error, and the likely fix (e.g. authenticate `gh`, check the
      URL, confirm access). Then stop.

      Otherwise, continue.

      ---

      Apply the following framework to those findings.

      ## STAGE CLASSIFICATION

      Pick EXACTLY ONE stage, based on the evidence — not on ambition:

      - **Research Idea**: Early exploration. No users, no deployment.
        Value delivered = insights that improve a product.
      - **Prototype**: Working demo. Some users. Not production-ready.
        Value delivered = insights + code that improve a product.
      - **Product**: Deployed, real users, actively maintained.
        Value delivered = an entire capability we ship ourselves. (Rare —
        do not classify as Product unless there is real deployment AND real users.)

      Be honest. Most research repos are Research Idea or Prototype.
      Over-classifying destroys the credibility of the whole document.

      ## STAGE-CALIBRATED CONTENT GUARD

      Apply this BEFORE writing any content. Your stage classification determines
      what hypotheses are appropriate. This guard prevents AI-generated framing
      that presupposes users, metrics, or PLG dynamics that have no empirical
      basis in the findings.

      **Research Idea — strict restrictions:**
      This stage has no deployed users, no production traffic, and no funnel data.
      Do NOT produce PLG framework content — not even as [AI Recommendation]
      hypotheses. Prohibited framing includes: funnel analysis, cohort retention
      curves, CAC/LTV estimates, A/B test designs, growth loops, activation rates,
      DAU/MAU projections, and any metric that presupposes an active user base.

      [AI Recommendation] hypotheses at this stage MUST stay within:
      - Q1 (problem): frame around what pain the idea addresses and for which role —
        no user-data claim required
      - Q2 (users): name a specific role or team segment the idea might serve —
        clearly flagged as a hypothesis, not a finding
      - Q3 (needs/wants): describe functional requirements that role plausibly has —
        no engagement or retention metrics
      - Q7 (success): early validation milestones only — e.g. "a pilot team can
        accomplish X without Y friction" — NOT product growth metrics such as
        "30% retention lift" or "DAU grows to Z", which have no basis at this stage

      **Prototype — conditional restrictions:**
      PLG framing (retention, engagement metrics, growth loops, funnel analysis) is
      appropriate ONLY if the repo findings contain actual user data: real user
      feedback quotes, usage numbers, pilot engagement reports, or A/B test results.
      If the findings contain no such data, treat Q4 as "Unknown — needs real data
      signal" and keep Q1–3 and Q7 hypotheses grounded in observed project signals,
      not assumed product dynamics.

      **Product — no restrictions:**
      Full PLG framework content is appropriate when grounded in the repo findings.
      Continue to label all content that extends beyond the evidence with
      [AI Recommendation — needs your review].

      ## METADATA FIELDS

      These are HEADER METADATA, not content. Two rules govern them:

      RULE 1 — They do NOT count against the 600-word limit.
      The word budget applies to the assessment content only. Never shorten,
      drop, or compress a content bullet in order to "make room" for these
      fields. They are free.

      RULE 2 — Resolve them as follows:

      **Researcher**
      Resolve in this strict order and stop at the first hit:
      1. If the `researcher` input above is non-empty, use it verbatim.
      2. Otherwise, use the top commit author reported under "COMMIT AUTHORSHIP"
         (evidence item 7) in the findings — the person with the highest commit
         count. Label it: "[AI Recommendation — needs your review]: [name]
         (top committer, N commits)".
      3. If commit authorship is "NOT FOUND", write exactly: `Unknown`

      **Repository / git_url**
      Resolve in this strict order and stop at the first hit:
      1. If the `git_url` input above is non-empty, use it verbatim.
      2. Otherwise, use the remote URL reported under "REPOSITORY REMOTE URL"
         (evidence item 8) in the findings, if it is present and is not
         "NOT FOUND".
      3. Otherwise, fall back to the `repo_path` value: {{repo_path}}

      This field is NEVER blank and NEVER "Unknown" — step 3 always produces a
      value. Do not invent a URL that appears nowhere in the findings; if you
      reach step 3, the local path IS the correct answer.

      ## THE 7 QUESTIONS

      Two modes — know which applies to each question:

      Questions 1, 2, 3, and 7: if the answer is not clear from the repo
      findings, write your best framing hypothesis based on the project's
      domain and likely use case. These developers will not have clear answers
      to a lot of these questions — help them think it through. But label every
      hypothesis with [AI Recommendation — needs your review] so they know it
      is a starting point, not a fact.

      Questions 4 and 5: if the answer is not in the findings, write the
      specific "Unknown" label below and stop. Do not invent evidence. Do not
      guess at a partner team. A blank is honest; a fabricated signal is harmful.

      1. What is the problem? — What breaks without this? Who suffers?
         If unclear: "[AI Recommendation — needs your review]:" + hypothesis.

      2. Who are the users? — A specific role, team, or segment. Never "everyone".
         If unclear: "[AI Recommendation — needs your review]:" + hypothesis.

      3. What are their needs/wants? — Needs = must-haves. Wants = nice-to-haves.
         If unclear: "[AI Recommendation — needs your review]:" + hypothesis.

      4. What evidence do we have that it matters? — Data, feedback, a partner
         ask, or a leadership signal.
         If none found: "Unknown — needs real data signal." Do not invent.

      5. Which team owns this space? — The product team or org that should
         consume this output.
         If unknown: "Unknown — needs a partner team." Do not guess.

      6. Have we talked to them? — Yes / No / Partial, plus what was learned
         (1 bullet if yes).

      7. What would success look like? — A concrete outcome. Not "we ship a
         feature" — an actual change in the world.
         If unclear: "[AI Recommendation — needs your review]:" + hypothesis.

      ## OUTPUT FORMAT

      Maximum 600 words total. Bullets and phrases only — NO prose paragraphs.
      Use as many bullets as the content needs. Some answers are one bullet;
      others need 2-3. Do not compress a richer answer into one bullet because
      the template shows one. Structure serves content, not the other way around.

      The 600-word limit covers the assessment content. It does NOT cover the
      Researcher and Repository metadata fields, section headings, or JSON
      structural syntax (keys, braces, brackets).

      ### FORMAT SELECTION

      Look at the "Output format requested" value above.
      - If it is exactly "json" (case-insensitive), produce FORMAT B.
      - For ANY other value — including "markdown", an empty string, a typo, or
        an unrecognized word — produce FORMAT A.

      Produce EXACTLY ONE of the two formats. Never both.

      ---

      ### FORMAT A — MARKDOWN (default)

      ```
      ## [Project Name] — Product 1-Pager

      **Stage**: [Research Idea | Prototype | Product]
      **Researcher**: [researcher name or "Unknown"]
      **Repository**: [resolved git URL or repo path]

      ---

      **The Problem**
      - [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]

      **The Users**
      - [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]

      **Needs / Wants**
      - Needs: [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]
      - Wants: [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]

      **Evidence It Matters**
      - [1+ bullets — or "Unknown — needs real data signal"]

      **Who Owns This Space**
      - [team/org — or "Unknown — needs a partner team"]

      **Have We Talked to Them?**
      - [Yes / No / Partial + key learnings in 1 bullet]

      **What Success Looks Like**
      - [1+ bullets — or "[AI Recommendation — needs your review]: [hypothesis]"]

      ---

      **Impact Path**
      [One sentence: this [stage] delivers [what] to [which product/team]]

      **Open Questions**
      1. [Most pressing unknown to move forward]
      2. [Second]
      3. [Third]
      ```

      ---

      ### FORMAT B — JSON

      Produce a single JSON object matching this schema EXACTLY. The annotations
      below describe each field's type and constraints — replace them with real
      values. The output must be valid JSON with no comments.

      ```
      {
        "project_name": "string — the actual project name from the repo",
        "stage": "string — EXACTLY one of: Research Idea | Prototype | Product",
        "researcher": "string — researcher name, or 'Unknown'",
        "git_url": "string — resolved remote URL, or the repo path fallback",
        "the_problem": ["string", "..."],
        "the_users": ["string", "..."],
        "needs_wants": {
          "needs": ["string", "..."],
          "wants": ["string", "..."]
        },
        "evidence_it_matters": ["string", "..."],
        "who_owns_this_space": ["string", "..."],
        "have_we_talked_to_them": {
          "status": "string — EXACTLY one of: Yes | No | Partial",
          "notes": "string — key learnings in one sentence; empty string if status is No"
        },
        "what_success_looks_like": ["string", "..."],
        "impact_path": "string — one sentence",
        "open_questions": ["string", "string", "string"]
      }
      ```

      JSON RULES — follow all of them:

      - Emit ALL 13 top-level keys. No key may be omitted, even when the answer
        is unknown. No extra keys beyond those listed.
      - Each array element is ONE bullet — the same bullet you would have written
        in the markdown format. Do not merge multiple bullets into one string.
      - Every array must contain at least one element. Never emit `[]`.
      - `open_questions` must contain EXACTLY three elements.
      - **[AI Recommendation] handling**: embed the marker INLINE at the start of
        the string value. Do NOT add boolean flags or wrapper objects.
        Correct:   "[AI Recommendation — needs your review]: Data teams likely
                    lose hours reconciling schema drift by hand."
        Incorrect: {"text": "...", "ai_recommendation": true}
      - **Unknown handling** for questions 4 and 5: emit the unknown label as a
        single-element array, exactly as in markdown.
        "evidence_it_matters": ["Unknown — needs real data signal"]
        "who_owns_this_space": ["Unknown — needs a partner team"]
      - `stage` and `have_we_talked_to_them.status` must match their enumerated
        values character-for-character. No variants, no extra qualifiers.
      - If `have_we_talked_to_them.status` is "No", `notes` is the empty string "".
      - `impact_path` is the same single sentence as the markdown Impact Path.
      - Output raw JSON ONLY: no ``` fences, no preamble, no trailing commentary.
      - Use 2-space indentation. No trailing commas. Escape any embedded
        double quotes and newlines properly.

      ## WRITING RULES

      These apply to BOTH formats identically. The format changes how the
      content is serialized — it never changes the content itself.

      - Replace [Project Name] / "project_name" with the actual project name.
        When multiple repos were analyzed (repo_paths was non-empty), use the
        overarching product or system name if one is evident across the repos.
        If no overarching name is clear, use the primary repo's name with a
        parenthetical note like "(+ N other repos)".
      - Plain language only. No jargon, no acronyms without expansion, no
        marketing voice, no hedging filler.
      - Every factual claim must trace back to the repo findings. If the
        findings do not support it, use "Unknown" or "[AI Recommendation]"
        per the question-level rules above — not silence, not invention.
      - [AI Recommendation — needs your review] answers are explicitly hypotheses
        to help the developer think. Write them as you would frame the question
        in a product review meeting, not as authoritative fact.
      - The Open Questions are the most valuable section for a low-product-sense
        engineer — make them the three questions that would most change the
        project's direction if answered. Not trivia.
      - Stay under 600 words. Cut adjectives before cutting substance.
      - The two documents must be interchangeable: the same repo and findings
        should yield the same assessment whether serialized as markdown or JSON.

      ## FINAL ACTION

      # Output location note: the 1-pager is written to the CURRENT WORKING
      # DIRECTORY (where Amplifier is invoked from), not necessarily inside the
      # target repo. If the user runs this from inside the repo they analyzed,
      # it lands there. If run from elsewhere, it lands in the invocation
      # directory. Print the full path so users can find it.

      Write the completed 1-pager to the current working directory, choosing the
      filename by format:
      - FORMAT A (markdown) -> `product-1-pager.md`
      - FORMAT B (json)     -> `product-1-pager.json`

      Write only ONE file — the one matching the requested format.

      If you wrote JSON, verify it parses as valid JSON before finishing. If it
      does not parse, fix it and rewrite the file.

      Print the full file path after writing. Then reply with the full contents
      of the file so the user can read it without opening it.
    output: "one_pager"
    timeout: 900
